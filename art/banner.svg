<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Laravel Package Skeleton">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9322c"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <g opacity="0.5">
    <circle cx="1112" cy="86" r="184" fill="#f9322c" opacity="0.06"/>
    <circle cx="1176" cy="248" r="124" fill="#38bdf8" opacity="0.05"/>
  </g>

  <g transform="translate(96 72)">
    <rect x="0" y="0" width="56" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="64" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">
      Laravel Package Skeleton
    </text>

    <text x="0" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Modern tooling, pre-configured. Start writing the package, not the setup.
    </text>

    <g transform="translate(0 156)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#cbd5e1">
      <g>
        <rect x="0" y="-20" width="86" height="32" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="43" y="2" text-anchor="middle">pest</text>
      </g>
      <g transform="translate(102 0)">
        <rect x="0" y="-20" width="124" height="32" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="62" y="2" text-anchor="middle">phpstan</text>
      </g>
      <g transform="translate(242 0)">
        <rect x="0" y="-20" width="110" height="32" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="55" y="2" text-anchor="middle">rector</text>
      </g>
      <g transform="translate(368 0)">
        <rect x="0" y="-20" width="86" height="32" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="43" y="2" text-anchor="middle">pint</text>
      </g>
      <g transform="translate(470 0)">
        <rect x="0" y="-20" width="146" height="32" rx="6" fill="#f9322c" fill-opacity="0.14" stroke="#f9322c" stroke-opacity="0.45"/>
        <text x="73" y="2" text-anchor="middle" fill="#fca5a5">100% covered</text>
      </g>
    </g>
  </g>

  <g transform="translate(940 56)" opacity="0.85">
    <rect x="0" y="0" width="248" height="208" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="22" cy="22" r="5" fill="#f87171"/>
    <circle cx="40" cy="22" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="22" r="5" fill="#34d399"/>
    <line x1="0" y1="44" x2="248" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14">
      <text x="20" y="76" fill="#64748b">$</text>
      <text x="36" y="76" fill="#e2e8f0">composer test</text>
      <text x="20" y="112" fill="#34d399">✓</text>
      <text x="40" y="112" fill="#94a3b8">type coverage</text>
      <text x="228" y="112" fill="#e2e8f0" text-anchor="end">100%</text>
      <text x="20" y="140" fill="#34d399">✓</text>
      <text x="40" y="140" fill="#94a3b8">code coverage</text>
      <text x="228" y="140" fill="#e2e8f0" text-anchor="end">100%</text>
      <text x="20" y="168" fill="#34d399">✓</text>
      <text x="40" y="168" fill="#94a3b8">phpstan</text>
      <text x="228" y="168" fill="#e2e8f0" text-anchor="end">max</text>
    </g>
  </g>
</svg>
