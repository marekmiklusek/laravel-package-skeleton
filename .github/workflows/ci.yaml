name: CI Pipeline
on:
  push:
    branches: [main, development]

jobs:
  # Run Laravel Pint for code formatting
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts
        
      - name: Run Laravel Pint
        run: ./vendor/bin/pint

  # Run PHStan for static analysis
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts
        
      - name: Run PHPStan
        run: ./vendor/bin/phpstan

  # Run composer test and security audit
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run security audit
        run: composer audit

      - name: List directory structure for tests
        run: |
          echo "Test directory structure:"
          ls -la tests/
          echo "Feature directory content:"
          ls -la tests/Feature/ || echo "Feature directory not found or empty"
          echo "Unit directory content:"
          ls -la tests/Unit/ || echo "Unit directory not found or empty"

      - name: Run tests
        run: composer test